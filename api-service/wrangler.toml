name = "api-service"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# One database for the whole API (events + places + admin auth). Create it with
# `pnpm db:create`, then paste the printed database_id here.
[[d1_databases]]
binding = "DB"
database_name = "cosplay-map-db"
database_id = "026fca28-7112-4361-bfed-0bee0e80d899"

[observability]
enabled = true

# Browser origins allowed to call this API (comma-separated). Empty = allow any
# (fine for local dev). In production set this to your site, e.g.:
#   ALLOWED_ORIGINS = "https://cosplaymap.fi,https://www.cosplaymap.fi"
[vars]
ALLOWED_ORIGINS = ""

# Public submission quota (per local day, Europe/Helsinki). The per-device limit
# keys off the client's X-Device-Id header; the per-IP limit is the backstop for
# clients that rotate that id. Both are strings - Workers vars always are.
SUBMISSIONS_PER_DEVICE_PER_DAY = "5"
SUBMISSIONS_PER_IP_PER_DAY = "20"

# Auto-import Helsinki Linked Events once a day (04:15 UTC). The sync's own
# freshness guard means an extra run is cheap - it no-ops if already up to date.
[triggers]
crons = ["15 4 * * *"]

# Secrets (NOT vars):
#   local:  put them in .dev.vars
#   remote: npx wrangler secret put ADMIN_TOKEN   (and SESSION_SECRET)
# WebAuthn relying-party config (RP_ID, RP_NAME, RP_ORIGIN) may be set as [vars]
# in production; localhost defaults apply when unset.
